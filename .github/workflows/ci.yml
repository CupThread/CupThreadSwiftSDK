name: CI

# Layered on purpose (see AGENTS.md → Testing Policy):
# - Pull requests run the cheap gate only: lint + swift test + one iOS
#   archive slice, so feedback stays fast.
# - Pushes to main run the full 7-platform archive matrix and the release
#   dry-run — the cross-platform compile safety net lives here, after merge.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install swiftlint
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Run SwiftLint
        run: swiftlint lint --strict
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Run Swift Tests
        run: swift test
  build-ios:
    name: Build (iOS)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build iOS slice
        run: |
          xcodebuild archive \
            -scheme CupThreadFeedback \
            -destination "generic/platform=iOS" \
            -archivePath "/tmp/iOS.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet
  build-platforms:
    name: Build (${{ matrix.name }})
    if: github.event_name == 'push'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: "generic/platform=iOS"
          - name: iOS Simulator
            destination: "generic/platform=iOS Simulator"
          - name: macOS
            destination: "generic/platform=macOS"
          - name: visionOS
            destination: "generic/platform=visionOS"
          - name: visionOS Simulator
            destination: "generic/platform=visionOS Simulator"
          - name: tvOS
            destination: "generic/platform=tvOS"
          - name: tvOS Simulator
            destination: "generic/platform=tvOS Simulator"
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build ${{ matrix.name }} slice
        run: |
          xcodebuild archive \
            -scheme CupThreadFeedback \
            -destination "${{ matrix.destination }}" \
            -archivePath "/tmp/${{ matrix.name }}.xcarchive" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES \
            -quiet
  release-dry-run:
    name: Release Dry-Run
    if: github.event_name == 'push'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Verify release build pipeline
        run: node scripts/release.mjs --version 0.0.0 --dry-run --skip-tests
